name: Clean up old workflow runs

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: Delete older completed workflow runs across the entire repository.
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete older completed runs across all workflows
    if: ${{ inputs.confirm_cleanup }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete older completed runs across all workflows
        uses: actions/github-script@v7
        with:
          script: |
            const protectedRunIds = new Set([
              43718135728, // Successful 8204e87 baseline (run #343)
              43719215185, // 24-hour retention change (run #344)
              context.runId, // Never delete this cleanup run
            ]);

            const { owner, repo } = context.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const targets = runs.filter(run =>
              run.status === 'completed' && !protectedRunIds.has(run.id)
            );

            core.info(`Found ${runs.length} workflow runs across the repository; ${targets.length} completed runs will be deleted.`);

            let deleted = 0;
            for (const run of targets) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted++;
                core.info(`Deleted workflow "${run.name}" run #${run.run_number} (${run.id}, branch: ${run.head_branch}).`);
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`Skipped workflow "${run.name}" run #${run.run_number} (${run.id}): GitHub returned 404 Not Found.`);
                  continue;
                }
                throw error;
              }
              // Avoid issuing a large burst of delete requests.
              await new Promise(resolve => setTimeout(resolve, 250));
            }

            core.info(`Cleanup complete. Deleted ${deleted} completed runs across all workflows. Preserved #343, #344, and this cleanup run.`);
