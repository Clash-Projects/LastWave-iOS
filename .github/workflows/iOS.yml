name: LastWave iOS

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - .github/workflows/cleanup-runs.yml
  pull_request:
    branches:
      - main
    paths-ignore:
      - .github/workflows/cleanup-runs.yml
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v0.1)'
        required: false
        default: 'v0.1'
      release_name:
        description: 'Release Title'
        required: false
        default: 'LastWave iOS v0.1 (Testing)'

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Analyze and build LastWave iOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Inspect Apple toolchain
        run: |
          flutter doctor -v
          xcodebuild -version
          pod --version

      - name: Prepare build-time secrets
        shell: bash
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LYRICS_API_KEY: ${{ secrets.LYRICS_API_KEY }}
        run: |
          set -euo pipefail
          : > .env
          if [[ -n "${ADDON_CLIENT_SECRET:-}" ]]; then
            printf 'ADDON_CLIENT_SECRET=%s\n' "$ADDON_CLIENT_SECRET" >> .env
            echo "::add-mask::$ADDON_CLIENT_SECRET"
          else
            echo "::warning::ADDON_CLIENT_SECRET is not configured. The IPA can compile, but add-on authentication cannot be verified."
          fi
          if [[ -n "${LYRICS_API_KEY:-}" ]]; then
            printf 'LYRICS_API_KEY=%s\n' "$LYRICS_API_KEY" >> .env
            echo "::add-mask::$LYRICS_API_KEY"
          fi
          dart tool/obfuscate_secrets.dart
          rm -f .env

      - name: Generate and configure iOS host
        run: bash tool/prepare_ios.sh

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Build unsigned iOS release (obfuscated)
        run: >-
          flutter build ios
          --release
          --no-codesign
          --obfuscate
          --split-debug-info=build/symbols

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected application bundle was not produced: $APP_PATH" >&2
            exit 1
          fi
          mkdir -p package/Payload
          ditto "$APP_PATH" package/Payload/Runner.app
          (cd package && /usr/bin/zip -qry ../LastWave.ipa Payload)

      - name: Upload downloadable unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-iOS
          path: |
            LastWave.ipa
            ios/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release metadata
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ inputs.tag_name }}"
            if [[ -z "$TAG" ]]; then
              TAG="v0.1"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          TITLE="${{ inputs.release_name }}"
          if [[ -z "$TITLE" ]]; then
            TITLE="LastWave iOS ${TAG} (Testing)"
          fi
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body: |
            ## LastWave iOS ${{ steps.release_meta.outputs.tag }} (Testing)

            This is an automated test pre-release build of LastWave for iOS (`.ipa`).

            ### 📦 Download Packages
            - **`LastWave.ipa`**: Unsigned iOS application package.

            > [!IMPORTANT]
            > **Sideloading & Installation:**
            > This package is unsigned and intended for testing. To install on iOS 15.0+:
            > - Install directly with **TrollStore** (if your iOS version supports CoreTrust bug).
            > - Or sign with your personal Apple ID using **SideStore**, **AltStore**, or **LiveContainer**.
            > - Or sign with Xcode / iOS App Signer using an Apple Developer profile.
          files: |
            LastWave.ipa
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
